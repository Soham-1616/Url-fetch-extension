<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy Tab URL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Current tab</h1>
      <p id="tab-title" aria-label="Current tab title">This extension is used for the copying the URL of the current tab and Switching the website theme.</p>
      <input id="url" type="text" readonly aria-label="Current tab URL" />
      <button id="copy" type="button">Copy URL</button>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="theme-heading">
        <h2 id="theme-heading">Website theme</h2>
        <div class="theme-controls">
          <button id="light-theme" class="theme-button" type="button" aria-pressed="false">Light</button>
          <button id="dark-theme" class="theme-button" type="button" aria-pressed="false">Dark</button>
        </div>
        <p id="theme-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
